[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent1-harness"
version = "0.1.0"
description = "A robust agent harness that builds applications from a spec, on the Claude Agent SDK."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Local-LLM engine (Ollama / LM Studio / vLLM / llama.cpp — any OpenAI-compatible server)
local = ["openai>=1.0"]
# macOS menu-bar app (scripts/menubar.py)
menubar = ["rumps>=0.4"]
dev = ["pytest>=7.0", "openai>=1.0"]

[project.scripts]
appbuilder = "harness.cli:main"
appbuilder-web = "harness.server:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
