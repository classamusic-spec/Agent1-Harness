name: tip-calculator
kind: frontend
language: html-css-js
description: 'A tip calculator single-page web app. Inputs: bill amount, a tip percentage
  with quick preset buttons (10/15/18/20/25), and number of people to split between. Show
  tip per person, total per person, and grand total, updating live. Clean modern card UI,
  soft gradient, rounded controls, light and dark via prefers-color-scheme, fully accessible.
  Plain HTML/CSS/JS in index.html, styles.css, app.js.'
verification:
- name: app builds
  command: python3 -c "import pathlib,sys; p=pathlib.Path('index.html'); sys.exit(0 if p.is_file()
    and p.stat().st_size>80 else 1)"
