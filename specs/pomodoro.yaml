name: pomodoro
kind: frontend
language: html-css-js
description: 'A calm Pomodoro focus timer as a single-page web app. Features: a large circular
  SVG progress ring that depletes as time runs, Start / Pause / Reset buttons, a 25:00 work
  timer, and a small completed-sessions counter that persists in localStorage. Clean modern
  Apple-like aesthetic, soft gradient background, light and dark via prefers-color-scheme,
  good accessibility. Plain HTML/CSS/JS, no build step: index.html, styles.css, app.js.'
verification:
- name: app builds
  command: python3 -c "import pathlib,sys; p=pathlib.Path('index.html'); sys.exit(0 if p.is_file()
    and p.stat().st_size>80 else 1)"
